name: Download community routes

on:
  schedule:
    - cron: '17 4 * * 1'   # every Monday at 04:17 UTC
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: write
  pages: write

jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download routes from Camptocamp
        run: node fetch-routes.mjs
      - name: Save the routes to the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No changes this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update community routes"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
